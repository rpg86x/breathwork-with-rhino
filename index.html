<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08121a">
<title>Breathwork with Rhino</title>
<style>
  :root {
    --text: #f4f1ec;
    --muted: rgba(244,241,236,.68);
    --faint: rgba(244,241,236,.38);
    --accent: #bfe9ef;
    --phase: #bfe9ef;
    --panel: rgba(8,10,16,.38);
    --line: rgba(255,255,255,.12);
    --center-top: 44%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08121a; color: var(--text);
    font: 16px/1.5 'Segoe UI', system-ui, sans-serif; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.idle, body.idle * { cursor: none !important; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Bovenbalk */
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: max(22px, env(safe-area-inset-top)) 32px 22px; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand svg { width: 52px; height: 34px; flex: none; color: var(--accent); transform-origin: 40% 70%;
    transform: scale(var(--breath, 1)); transition: color 1.2s; }
  .brand b { font: 600 19px/1 Georgia, serif; letter-spacing: .3px; white-space: nowrap; }
  .brand span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; }
  .tools { display: flex; align-items: center; gap: 14px; }
  .keys { font-size: 13px; color: var(--faint); }
  kbd { font: 600 12px 'Segoe UI', sans-serif; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; color: var(--muted); margin: 0 2px; }
  .iconbtn { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; backdrop-filter: blur(6px); white-space: nowrap; }
  .iconbtn:hover { border-color: var(--accent); }
  .lang { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px;
    backdrop-filter: blur(6px); }
  .lang button { background: none; border: 0; color: var(--muted); font: 600 13px 'Segoe UI', sans-serif;
    padding: 5px 11px; border-radius: 7px; cursor: pointer; }
  .lang button.on { background: var(--accent); color: #0b1218; }

  /* Themakiezer: vier kleurstipjes per thema */
  .themes { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
    padding: 4px; backdrop-filter: blur(6px); }
  .themes button { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
    background: var(--sw); background-clip: padding-box; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
    transition: transform .25s, border-color .25s; }
  .themes button:hover { transform: scale(1.12); }
  .themes button.on { border-color: var(--text); transform: scale(1.12); }
  .themeName { position: fixed; top: 74px; right: 32px; z-index: 5; font-size: 12.5px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity .4s; pointer-events: none; }
  .themeName.show { opacity: 1; }

  /* Pijlen links en rechts */
  .nav { position: fixed; top: var(--center-top); transform: translateY(-50%); z-index: 5; width: 64px; height: 120px;
    display: grid; place-items: center; background: none; border: 0; color: var(--text); cursor: pointer;
    opacity: .55; transition: opacity .3s; }
  .nav:hover { opacity: 1; }
  .nav svg { width: 34px; height: 34px; }
  .nav.prev { left: 16px; } .nav.next { right: 16px; }

  /* Ademtekst in het midden van de cirkel */
  .center { position: fixed; left: 50%; top: var(--center-top); transform: translate(-50%, -50%); text-align: center;
    pointer-events: none; z-index: 2; }
  .phase { font-weight: 300; font-size: clamp(22px, 3.4vmin, 40px); letter-spacing: .5px;
    text-shadow: 0 0 22px var(--phase), 0 0 2px rgba(0,0,0,.35); }
  .count { font-weight: 200; font-size: clamp(44px, 9vmin, 104px); line-height: 1; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .paused { margin-top: 10px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: none; }
  body.is-paused .paused { display: block; }

  /* Info over de oefening */
  .info { position: fixed; left: 40px; bottom: 34px; max-width: 470px; z-index: 5;
    transition: opacity .35s, transform .35s; }
  .info.swap { opacity: 0; transform: translateY(8px); }
  .num { font-size: 13px; letter-spacing: 2px; color: var(--muted); }
  .info h1 { margin: 2px 0 8px; font: 600 clamp(26px, 3.6vmin, 38px)/1.1 Georgia, serif; }
  .rhythm { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .rhythm span { font-size: 13px; padding: 2px 10px 2px 8px; border-radius: 99px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .rhythm span i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--accent)); }
  .rhythm span b { color: var(--text); font-weight: 600; }
  .info p { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
    background: var(--accent); color: #0b1218; transition: background 1.2s; }
  .note { margin-top: 10px; font-size: 13px; color: var(--faint); }

  /* Rechtsonder: sessie */
  .stats { position: fixed; right: 40px; bottom: 34px; text-align: right; z-index: 5; font-size: 14px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .donate { position: fixed; right: 40px; bottom: 12px; z-index: 5; font-size: 13px; color: var(--muted);
    text-decoration: none; padding: 2px 0; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s, opacity .8s; }
  .donate:hover, .donate:focus-visible { color: var(--accent); border-bottom-color: var(--accent); outline: none; }

  /* Bediening: pauze, opnieuw, rondes */
  .controls { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center;
    gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; backdrop-filter: blur(6px); }
  .controls button { background: none; border: 0; color: var(--text); cursor: pointer; border-radius: 99px;
    height: 36px; min-width: 36px; display: grid; place-items: center; font: 600 15px 'Segoe UI', sans-serif; opacity: .85; }
  .controls button:hover { opacity: 1; background: rgba(255,255,255,.08); }
  .controls svg { width: 18px; height: 18px; }
  .controls .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .rounds { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); padding-left: 6px; }
  .rounds b { min-width: 26px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
  .rounds button { min-width: 30px; height: 30px; font-size: 17px; }

  .dots { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: var(--faint); cursor: pointer;
    transition: background .3s, transform .3s; }
  .dots button.on { background: var(--text); transform: scale(1.35); }

  /* Na een paar seconden stilte verdwijnt de bediening */
  .fade { transition: opacity .8s; }
  body.idle .fade { opacity: 0; pointer-events: none; }
  body.idle .info, body.idle .stats { opacity: .75; }
  body.is-fs .keys { display: none; }

  /* Middelgrote schermen: sneltoetsen weg, minder ruimte */
  @media (max-width: 1100px) {
    .keys { display: none; }
    .info { max-width: 380px; }
  }
  /* Telefoon en smalle vensters: cirkel hoger, info onderaan over de volle breedte */
  @media (max-width: 760px) {
    :root { --center-top: 33%; }
    .top { padding: max(14px, env(safe-area-inset-top)) 14px 12px; }
    .brand svg { width: 40px; height: 26px; }
    .brand b { font-size: 16px; }
    .brand span { display: none; }
    .tools { gap: 8px; }
    .fsLabel { display: none; }
    .iconbtn { padding: 7px 10px; }
    .lang button { padding: 4px 8px; }
    .themes { gap: 3px; padding: 3px; }
    .themes button { width: 22px; height: 22px; }
    .themeName { top: 112px; right: 16px; }
    .nav { width: 44px; height: 90px; } .nav.prev { left: 2px; } .nav.next { right: 2px; }
    .nav svg { width: 26px; height: 26px; }
    .info { left: 18px; right: 18px; max-width: none; bottom: 108px; }
    .info h1 { font-size: 24px; margin-bottom: 6px; }
    .info p { font-size: 14px; margin-bottom: 8px; }
    .rhythm { margin-bottom: 8px; }
    .stats { top: calc(max(14px, env(safe-area-inset-top)) + 52px); bottom: auto; right: 16px; font-size: 12.5px; }
    .controls { bottom: 40px; }
    .donate { top: calc(max(14px, env(safe-area-inset-top)) + 76px); bottom: auto; right: 16px; font-size: 12px; }
  }
  @media (max-width: 480px) {
    .brand b { display: none; }
    .info .note, .info .tags { display: none; }
  }
  /* Lage vensters (liggende telefoon, klein laptopvenster) */
  @media (max-height: 560px) {
    :root { --center-top: 52%; }
    .info p, .info .note { display: none; }
    .info { bottom: 22px; } .stats { bottom: 22px; }
    .controls { bottom: 26px; } .dots { bottom: 8px; }
  }
  @media (max-height: 560px) and (max-width: 760px) {
    :root { --center-top: 42%; }
    .info { bottom: 70px; } .info .tags { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="top fade">
  <div class="brand">
    <svg viewBox="0 0 64 40" aria-hidden="true">
      <path fill="currentColor" d="M12 22c0-7 7-12 18-12 6 0 11 1 14 3l1-4 3 4c5 1 9 5 11 9l4-8 1 11c0 3-2 5-5 5h-6l-3 2v8h-5v-6c-3 1-7 1-10 1v5h-5v-6l-6-1v7h-5v-9c-4-1-7-5-7-9z"/>
      <circle cx="51" cy="20" r="1.3" fill="#0b1218"/>
    </svg>
    <div><b>Breathwork with Rhino</b><span id="tagline">Adem · Rust · Focus</span></div>
  </div>
  <div class="tools">
    <div class="keys" id="keys"></div>
    <div class="themes" id="themes" role="radiogroup" aria-label="Kleurthema"></div>
    <div class="lang" role="group" aria-label="Taal / Language">
      <button data-lang="nl">NL</button><button data-lang="en">EN</button>
    </div>
    <button class="iconbtn" id="fsBtn"><span aria-hidden="true">⛶</span> <span class="fsLabel" id="fsLabel">Volledig scherm</span></button>
  </div>
</div>
<div class="themeName" id="themeName" aria-live="polite"></div>

<button class="nav prev fade" id="prev" aria-label="Vorige oefening">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="nav next fade" id="next" aria-label="Volgende oefening">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>

<div class="center" aria-live="off">
  <div class="phase" id="phase">Adem in</div>
  <div class="count" id="count">4</div>
  <div class="paused" id="pausedLbl">Gepauzeerd</div>
</div>

<section class="info" id="info">
  <div class="num" id="num"></div>
  <h1 id="title"></h1>
  <div class="rhythm" id="rhythm"></div>
  <p id="desc"></p>
  <div class="tags" id="tags"></div>
  <div class="note" id="note"></div>
</section>

<a class="donate fade" id="donate" href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener">☕ Trakteer me op een koffie</a>
<div class="stats"><span id="sessLbl">Sessie</span> <b id="sess">00:00</b> · <b id="cycles">0</b> <span id="cycLbl">ademcycli</span></div>

<div class="controls fade" id="controls">
  <button id="playBtn" aria-label="Pauze">
    <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
  </button>
  <button id="resetBtn" aria-label="Opnieuw beginnen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
  </button>
  <span class="sep"></span>
  <div class="rounds">
    <span id="roundsLbl">Rondes</span>
    <button id="roundsMinus" aria-label="Minder rondes">−</button>
    <b id="roundsVal">∞</b>
    <button id="roundsPlus" aria-label="Meer rondes">+</button>
  </div>
</div>
<div class="dots fade" id="dots"></div>

<script>
'use strict';
// Elke oefening is een lijst fases. `to` is hoe vol de longen aan het eind van de fase zijn (0..1);
// zonder `to` blijft het niveau gelijk (vasthouden). `side` -1/1 = links/rechts neusgat.
const IN = (s, label = 'Adem in', to = 1) => ({ label, dur: s, to, kind: 'In' });
const OUT = (s, label = 'Adem uit', to = 0) => ({ label, dur: s, to, kind: 'Uit' });
const HOLD = (s, label = 'Houd vast') => ({ label, dur: s, kind: 'Vast' });

const EXERCISES = [
  {
    title: 'Langer uitademen', phases: [IN(4), OUT(6)],
    desc: 'Adem rustig in en laat de uitademing net iets langer duren. Een lange uitademing remt je hartslag af en zet je lichaam in de ruststand.',
    tags: ['Stress', 'Beginners', 'Altijd bruikbaar'],
    theme: { bg: ['#123247', '#08121a'], glow: [127, 211, 224], ring: '#bfe9ef' },
  },
  {
    title: 'Box breathing', phases: [IN(4), HOLD(4), OUT(4), HOLD(4)],
    desc: 'Vier gelijke tellen: in, vast, uit, vast. Brengt je hoofd tot rust en scherpt je aandacht. Wordt veel gebruikt om kalm te blijven onder druk.',
    tags: ['Focus', 'Kalm onder druk', 'Voor een afspraak'],
    theme: { bg: ['#1f2a4a', '#0a0e1a'], glow: [150, 170, 240], ring: '#cdd6ff' },
  },
  {
    title: 'Coherent ademen', phases: [IN(5.5), OUT(5.5)],
    desc: 'Ongeveer 5,5 ademhalingen per minuut. Hartslag en adem vallen in een rustig, gelijk ritme. Fijn om dagelijks een paar minuten te doen.',
    tags: ['Balans', 'Dagelijks 5 min', 'Hartcoherentie'],
    theme: { bg: ['#173a33', '#07140f'], glow: [140, 220, 190], ring: '#c9f2e2' },
  },
  {
    title: 'Driehoek', phases: [IN(4), HOLD(4), OUT(4)],
    desc: 'Een zachtere versie van box breathing, zonder pauze na het uitademen. Rustgevend, en makkelijker vol te houden.',
    tags: ['Ontspanning', 'Beginners', 'Focus'],
    theme: { bg: ['#2b2a4a', '#0d0c18'], glow: [190, 170, 240], ring: '#e2d8ff' },
  },
  {
    title: 'Fysiologische zucht', phases: [IN(2, 'Adem in', 0.75), IN(1, 'Nog een beetje in'), OUT(6, 'Lang uit')],
    desc: 'Adem twee keer kort in door je neus en blaas daarna lang en rustig uit door je mond. Zo laat je acute spanning het snelst zakken.',
    tags: ['Acute stress', 'Snel effect', '1–3 minuten'],
    theme: { bg: ['#3a2a3f', '#120c14'], glow: [235, 160, 200], ring: '#ffd6ea' },
  },
  {
    title: '4-7-8 ontspanning', phases: [IN(4), HOLD(7), OUT(8)],
    desc: 'Vier tellen in, zeven tellen vast, acht tellen uit. De lange uitademing maakt je lichaam zwaar en rustig.',
    tags: ['Inslapen', 'Diepe ontspanning', 'Angst'],
    note: 'Begin met 4 rondes. Wordt je licht in je hoofd, adem dan even gewoon door.',
    theme: { bg: ['#1a2440', '#070a14'], glow: [120, 150, 230], ring: '#c3d0ff' },
  },
  {
    title: 'Ujjayi · oceaanadem', phases: [IN(5), OUT(7)],
    desc: 'Adem door je neus en maak je keel een beetje nauwer, zodat je adem zacht ruist als de zee. Dit verwarmt en helpt je focussen tijdens yoga.',
    tags: ['Yoga', 'Concentratie', "Tijdens asana's"],
    theme: { bg: ['#0f3a46', '#051317'], glow: [100, 210, 220], ring: '#b8f0f5' },
  },
  {
    title: 'Nadi Shodhana', phases: [
      { ...IN(4, 'In door links'), side: -1 }, { ...HOLD(4), side: 0 }, { ...OUT(4, 'Uit door rechts'), side: 1 },
      { ...IN(4, 'In door rechts'), side: 1 }, { ...HOLD(4), side: 0 }, { ...OUT(4, 'Uit door links'), side: -1 }],
    desc: 'Wisselademhaling: sluit om de beurt een neusgat af met je duim of ringvinger. Brengt rust en balans, en een helder hoofd.',
    tags: ['Balans', 'Meditatie', 'Helder hoofd'],
    theme: { bg: ['#2c3a24', '#0c120a'], glow: [190, 220, 140], ring: '#e6f5c8' },
  },
  {
    title: 'Langzaam naar slaap', phases: [IN(4), OUT(8), HOLD(2, 'Rust')],
    desc: 'Een extra lange uitademing met een korte rust. Je lichaam gaat langzamer, klaar om te slapen.',
    tags: ['Slapen', 'Avondritueel', 'In bed'],
    theme: { bg: ['#1b1733', '#07060f'], glow: [160, 140, 220], ring: '#d6ccff' },
  },
  {
    title: 'Gevorderde box', phases: [IN(6), HOLD(6), OUT(6), HOLD(6)],
    desc: 'Box breathing met zes tellen. Diep, langzaam en meditatief. Ideaal als 4-4-4-4 al makkelijk voelt.',
    tags: ['Gevorderd', 'Meditatie', 'Longcapaciteit'],
    theme: { bg: ['#2a2238', '#0b0810'], glow: [200, 170, 230], ring: '#eadcff' },
  },
  {
    title: 'Opladen', phases: [IN(4), OUT(2)],
    desc: 'Diep in, kort en krachtig uit. Geeft energie en maakt je wakker, fijn bij een middagdip.',
    tags: ['Energie', 'Middagdip', 'Max 1–2 min'],
    note: 'Stop als je licht in je hoofd wordt en adem rustig verder.',
    theme: { bg: ['#4a2a1c', '#140a06'], glow: [245, 170, 110], ring: '#ffd9bf' },
  },
];

// ---- Engelse teksten (zelfde volgorde als EXERCISES) ----
const EXERCISES_EN = [
  { title: 'Longer exhale',
    desc: 'Breathe in calmly and let the exhale last a little longer. A long exhale slows your heart rate and puts your body into rest mode.',
    tags: ['Stress', 'Beginners', 'Anytime'] },
  { title: 'Box breathing',
    desc: 'Four equal counts: in, hold, out, hold. Calms your mind and sharpens your attention. Widely used to stay calm under pressure.',
    tags: ['Focus', 'Calm under pressure', 'Before a meeting'] },
  { title: 'Coherent breathing',
    desc: 'About 5.5 breaths per minute. Heart rate and breath settle into a calm, even rhythm. Great to practise for a few minutes every day.',
    tags: ['Balance', '5 min daily', 'Heart coherence'] },
  { title: 'Triangle',
    desc: 'A gentler version of box breathing, without the pause after the exhale. Relaxing and easier to sustain.',
    tags: ['Relaxation', 'Beginners', 'Focus'] },
  { title: 'Physiological sigh',
    desc: 'Take two short inhales through your nose, then blow out long and slow through your mouth. The fastest way to release acute tension.',
    tags: ['Acute stress', 'Quick effect', '1–3 minutes'] },
  { title: '4-7-8 relaxation',
    desc: 'Four counts in, seven counts hold, eight counts out. The long exhale makes your body feel heavy and calm.',
    tags: ['Falling asleep', 'Deep relaxation', 'Anxiety'],
    note: 'Start with 4 rounds. If you feel light-headed, just breathe normally for a moment.' },
  { title: 'Ujjayi · ocean breath',
    desc: 'Breathe through your nose and slightly narrow your throat, so your breath sounds like the sea. Warms you up and helps you focus during yoga.',
    tags: ['Yoga', 'Concentration', 'During asanas'] },
  { title: 'Nadi Shodhana',
    desc: 'Alternate nostril breathing: close one nostril at a time with your thumb or ring finger. Brings calm, balance and a clear mind.',
    tags: ['Balance', 'Meditation', 'Clear mind'] },
  { title: 'Slowly to sleep',
    desc: 'An extra long exhale followed by a short rest. Your body slows down, ready for sleep.',
    tags: ['Sleep', 'Evening ritual', 'In bed'] },
  { title: 'Advanced box',
    desc: 'Box breathing with six counts. Deep, slow and meditative. Ideal once 4-4-4-4 feels easy.',
    tags: ['Advanced', 'Meditation', 'Lung capacity'] },
  { title: 'Energise',
    desc: 'Deep in, short and powerful out. Gives you energy and wakes you up, great for an afternoon slump.',
    tags: ['Energy', 'Afternoon slump', 'Max 1–2 min'],
    note: 'Stop if you feel light-headed and continue breathing calmly.' },
];

const PHASE_EN = {
  'Adem in': 'Breathe in', 'Adem uit': 'Breathe out', 'Houd vast': 'Hold', 'Rust': 'Rest',
  'Nog een beetje in': 'A little more in', 'Lang uit': 'Long exhale',
  'In door links': 'In through left', 'Uit door rechts': 'Out through right',
  'In door rechts': 'In through right', 'Uit door links': 'Out through left',
};
const CHIP = {
  nl: { 'Adem in': 'In', 'Adem uit': 'Uit', 'Lang uit': 'Uit', 'Houd vast': 'Vast', 'Nog een beetje in': '+ in', 'Rust': 'Rust',
        'In door links': 'In L', 'Uit door rechts': 'Uit R', 'In door rechts': 'In R', 'Uit door links': 'Uit L' },

};

// ---- Kleurthema's: één kleur per ademfase ----
const THEMES = [
  { id: 'classic', name: null }, // kleuren van de oefening zelf (het oorspronkelijke ontwerp)
  { id: 'solar',  name: 'Solar Fire',    in: '#EE8C42', holdIn: '#F2BD61', out: '#C96860', holdOut: '#914C62' },
  { id: 'ocean',  name: 'Ocean Breath',  in: '#38B8CA', holdIn: '#84D6D4', out: '#387FA8', holdOut: '#304C83' },
  { id: 'forest', name: 'Forest Zen',    in: '#78B78A', holdIn: '#B5C58B', out: '#488F82', holdOut: '#506A65' },
  { id: 'cosmic', name: 'Cosmic Breath', in: '#A68BFA', holdIn: '#D3A5E8', out: '#7D83CE', holdOut: '#534C94' },
];
const KINDS = ['in', 'holdIn', 'out', 'holdOut'];

// ---- Kleine hulpjes ----
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, t)));
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.min(1, Math.max(0, t));
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const rgbStr = a => `rgb(${a.map(Math.round).join(',')})`;
const rgbaStr = (a, al) => `rgba(${a.map(Math.round).join(',')},${al})`;
const WHITE = [255, 255, 255];
const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---- Tijdlijn: de enige bron voor fases, niveaus en kleuren ----
// Fases van 0 seconden worden overgeslagen; elke fase krijgt begin/eind-tijd, begin/eind-niveau en een soort.
function buildTimeline(ex) {
  let phases = ex.phases.filter(p => Number.isFinite(p.dur) && p.dur > 0);
  if (!phases.length) phases = [IN(4), OUT(4)];
  const startLevel = phases.reduce((l, p) => p.to ?? l, 0); // niveau aan het eind van de vorige cyclus
  let t = 0, prev = startLevel;
  const list = phases.map(p => {
    const from = prev, to = p.to ?? prev;
    let kind;
    if (to > from + 1e-6) kind = 'in';
    else if (to < from - 1e-6) kind = 'out';
    else kind = to >= 0.5 ? 'holdIn' : 'holdOut';
    const ph = { ...p, t0: t, t1: t + p.dur, from, to, kind };
    t += p.dur; prev = to;
    return ph;
  });
  return { phases: list, total: t, endLevel: prev };
}
const TIMELINES = EXERCISES.map(buildTimeline);

// Toestand op tijdstip `t` (seconden sinds start van de oefening). rounds = 0 betekent eindeloos.
function stateAt(tl, t, rounds) {
  const total = tl.total;
  if (rounds > 0 && t >= rounds * total - 1e-9) {
    const last = tl.phases[tl.phases.length - 1];
    return { done: true, ph: last, i: tl.phases.length - 1, level: tl.endLevel, left: 0, cycles: rounds, rest: total, k: 1 };
  }
  const cycles = Math.floor(t / total);
  const rest = t - cycles * total;
  let i = tl.phases.findIndex(p => rest < p.t1);
  if (i < 0) i = tl.phases.length - 1;
  const ph = tl.phases[i];
  const k = clamp01((rest - ph.t0) / ph.dur);
  return { done: false, ph, i, level: lerp(ph.from, ph.to, ease(k)), left: ph.t1 - rest, cycles, rest, k };
}

// ---- Instellingen ----
const LANG_STORE = 'rhino-breath-lang', STORE = 'rhino-breath-idx';
const THEME_STORE = 'rhino-breath-theme', ROUNDS_STORE = 'rhino-breath-rounds';
const ROUND_STEPS = [0, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30, 50];
let lang = store.get(LANG_STORE) === 'en' ? 'en' : 'nl';
let themeId = THEMES.some(t => t.id === store.get(THEME_STORE)) ? store.get(THEME_STORE) : 'classic';
let rounds = ROUND_STEPS.includes(parseInt(store.get(ROUNDS_STORE), 10)) ? parseInt(store.get(ROUNDS_STORE), 10) : 0;
let idx = Math.min(EXERCISES.length - 1, Math.max(0, parseInt(store.get(STORE), 10) || 0));
const tx = i => lang === 'en' ? { ...EXERCISES[i], ...EXERCISES_EN[i] } : EXERCISES[i];
const phaseLabel = l => lang === 'en' ? (PHASE_EN[l] || l) : l;

const mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduced = !!(mq && mq.matches);
if (mq) (mq.addEventListener ? mq.addEventListener('change', e => { reduced = e.matches; }) : mq.addListener(e => { reduced = e.matches; }));

// ---- Uiterlijk (achtergrond + fasekleuren), altijd als getallen zodat overgangen niet stuklopen ----
function lookFor(i, id) {
  const ex = EXERCISES[i], th = THEMES.find(t => t.id === id) || THEMES[0];
  if (th.id === 'classic') {
    const ring = hexRgb(ex.theme.ring), glow = ex.theme.glow.slice(), bg0 = hexRgb(ex.theme.bg[0]), bg1 = hexRgb(ex.theme.bg[1]);
    return { bg0, bg1, accent: ring,
      in: ring, holdIn: mixC(ring, WHITE, 0.45), out: glow, holdOut: mixC(glow, bg0, 0.45) };
  }
  const c = Object.fromEntries(KINDS.map(k => [k, hexRgb(th[k])]));
  return { ...c, accent: c.in,
    bg0: mixC(c.holdOut, [8, 14, 22], 0.62), bg1: mixC(c.holdOut, [3, 5, 9], 0.9) };
}
const mixLook = (a, b, t) => Object.fromEntries(Object.keys(b).map(k => [k, mixC(a[k], b[k], t)]));
let look = lookFor(idx, themeId), lookFrom = null, lookK = 1;
function changeLook() { lookFrom = look; lookK = 0; }

// ---- Toestand ----
let clock = 0, session = 0, lastNow = null, paused = false;
let swap = null, shownLevel = 0, side = 0;
let finished = false;

const $ = id => document.getElementById(id);
const dots = $('dots');
EXERCISES.forEach((ex, i) => {
  const b = document.createElement('button');
  b.setAttribute('aria-label', ex.title);
  b.addEventListener('click', () => go(i));
  dots.appendChild(b);
});

// ---- Themakiezer ----
const themesEl = $('themes');
THEMES.forEach(th => {
  const b = document.createElement('button');
  b.dataset.theme = th.id;
  b.setAttribute('role', 'radio');
  const cols = th.id === 'classic' ? ['#bfe9ef', '#7fd3e0', '#cdd6ff', '#e2d8ff'] : KINDS.map(k => th[k]);
  b.style.setProperty('--sw', `conic-gradient(${cols[0]} 0 25%, ${cols[1]} 0 50%, ${cols[2]} 0 75%, ${cols[3]} 0)`);
  b.addEventListener('click', () => setTheme(th.id));
  themesEl.appendChild(b);
});
const themeTitle = th => th.name || UI[lang].classic;
let nameTimer;
function setTheme(id, announce = true) {
  if (id === themeId) return;
  themeId = id; store.set(THEME_STORE, id);
  changeLook(); renderThemes();
  if (announce) {
    const el = $('themeName');
    el.textContent = themeTitle(THEMES.find(t => t.id === id));
    el.classList.add('show'); clearTimeout(nameTimer);
    nameTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
}
function renderThemes() {
  themesEl.setAttribute('aria-label', UI[lang].theme);
  [...themesEl.children].forEach(b => {
    const th = THEMES.find(t => t.id === b.dataset.theme), on = th.id === themeId;
    b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
    b.title = themeTitle(th); b.setAttribute('aria-label', themeTitle(th));
  });
}

// ---- Info-paneel ----
let infoTimer = null;
function renderInfo() {
  const ex = tx(idx), tl = TIMELINES[idx];
  $('num').textContent = `${String(idx + 1).padStart(2, '0')} / ${String(EXERCISES.length).padStart(2, '0')}`;
  $('title').textContent = ex.title;
  // Ritme samenvatten, zoals "In 4 · Vast 7 · Uit 8"; het bolletje toont de fasekleur
  const seen = new Set(), parts = [];
  tl.phases.forEach(p => {
    const key = p.label + p.dur;
    if (tl.phases.length > 4 && seen.has(key)) return;
    seen.add(key);
    const short = CHIP[lang][p.label] || phaseLabel(p.label);
    parts.push(`<span data-kind="${p.kind}"><i></i>${short} <b>${String(p.dur).replace('.', lang === 'nl' ? ',' : '.')}</b></span>`);
  });
  $('rhythm').innerHTML = parts.join('');
  $('desc').textContent = ex.desc;
  $('tags').innerHTML = ex.tags.map(t => `<span>${t}</span>`).join('');
  $('note').textContent = ex.note || '';
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === idx));
  lastPhaseCss = ''; // ritmebolletjes direct inkleuren
}

function go(n) {
  n = (n + EXERCISES.length) % EXERCISES.length;
  if (n === idx) return;
  const info = $('info');
  info.classList.add('swap');
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => { renderInfo(); info.classList.remove('swap'); }, reduced ? 0 : 350);
  swap = { from: shownLevel, k: 0 };
  idx = n; clock = 0; finished = false;
  changeLook();
  store.set(STORE, String(idx));
  updateControls();
}

// ---- Pauze, opnieuw, rondes ----
function setPaused(p) {
  paused = p;
  document.body.classList.toggle('is-paused', paused && !finished);
  updateControls();
}
function togglePause() {
  if (finished) { restart(); return; }
  setPaused(!paused);
}
function restart() {
  swap = { from: shownLevel, k: 0 };
  clock = 0; finished = false;
  setPaused(false);
}
function stepRounds(dir) {
  let i = ROUND_STEPS.indexOf(rounds) + dir;
  i = Math.max(0, Math.min(ROUND_STEPS.length - 1, i));
  rounds = ROUND_STEPS[i];
  store.set(ROUNDS_STORE, String(rounds));
  // Al verder dan het nieuwe aantal? Dan is de oefening klaar; meer rondes na 'klaar' gaat gewoon verder.
  const total = TIMELINES[idx].total;
  if (rounds > 0 && clock >= rounds * total) clock = rounds * total;
  if (finished && (rounds === 0 || clock < rounds * total)) { finished = false; setPaused(false); }
  updateControls();
}
function updateControls() {
  const t = UI[lang], showPlay = paused || finished;
  $('icoPause').style.display = showPlay ? 'none' : '';
  $('icoPlay').style.display = showPlay ? '' : 'none';
  $('playBtn').setAttribute('aria-label', finished ? t.again : paused ? t.play : t.pause);
  $('playBtn').title = $('playBtn').getAttribute('aria-label');
  $('roundsVal').textContent = rounds === 0 ? '∞' : rounds;
  $('roundsMinus').disabled = rounds === ROUND_STEPS[0];
  $('roundsPlus').disabled = rounds === ROUND_STEPS[ROUND_STEPS.length - 1];
}
$('playBtn').addEventListener('click', togglePause);
$('resetBtn').addEventListener('click', restart);
$('roundsMinus').addEventListener('click', () => stepRounds(-1));
$('roundsPlus').addEventListener('click', () => stepRounds(1));

// ---- Bediening ----
$('prev').addEventListener('click', () => go(idx - 1));
$('next').addEventListener('click', () => go(idx + 1));
$('fsBtn').addEventListener('click', toggleFs);
// Dubbelklikken op de achtergrond wisselt volledig scherm, maar niet bij snel klikken op knoppen
addEventListener('dblclick', e => { if (!e.target.closest('a, button, .top, .controls, .dots, .info')) toggleFs(); });

function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
function updateFs() {
  const fs = !!document.fullscreenElement;
  document.body.classList.toggle('is-fs', fs);
  $('fsLabel').textContent = fs ? UI[lang].win : UI[lang].fs;
  $('fsBtn').setAttribute('aria-label', fs ? UI[lang].win : UI[lang].fs);
}
document.addEventListener('fullscreenchange', updateFs);

// ---- Taal ----
function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  $('tagline').textContent = t.tagline;
  $('keys').innerHTML = t.keys;
  $('pausedLbl').textContent = t.paused;
  $('sessLbl').textContent = t.session;
  $('cycLbl').textContent = t.cycles;
  $('roundsLbl').textContent = t.rounds;
  $('donate').textContent = t.donate;
  $('resetBtn').setAttribute('aria-label', t.reset); $('resetBtn').title = t.reset;
  $('roundsMinus').setAttribute('aria-label', t.less);
  $('roundsPlus').setAttribute('aria-label', t.more);
  $('prev').setAttribute('aria-label', t.prev);
  $('next').setAttribute('aria-label', t.next);
  updateFs();
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  [...dots.children].forEach((d, i) => d.setAttribute('aria-label', tx(i).title));
  renderThemes(); renderInfo(); updateControls();
}
function setLang(l) { lang = l; store.set(LANG_STORE, lang); applyLang(); }
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === '>' || k === '.' || k === 'PageDown') go(idx + 1);
  else if (k === 'ArrowLeft' || k === '<' || k === ',' || k === 'PageUp') go(idx - 1);
  else if (k === 'Home') go(0);
  else if (k === 'End') go(EXERCISES.length - 1);
  else if (k === ' ' || k === 'Spacebar' || k === 'p' || k === 'P') togglePause();
  else if (k === 'r' || k === 'R') restart();
  else if (k === 't' || k === 'T') setTheme(THEMES[(THEMES.findIndex(t => t.id === themeId) + 1) % THEMES.length].id);
  else if (k === '+' || k === '=') stepRounds(1);
  else if (k === '-' || k === '_') stepRounds(-1);
  else if (k === 'f' || k === 'F') toggleFs();
  else if (k === 'l' || k === 'L') setLang(lang === 'nl' ? 'en' : 'nl');
  else if (/^[0-9]$/.test(k)) go(k === '0' ? 9 : parseInt(k, 10) - 1);
  else return;
  e.preventDefault(); // voorkomt dat spatie ook nog een gefocuste knop indrukt
  wake();
});

// Vegen op het touchscreen (niet als je een knop aanraakt)
let touchX = null;
addEventListener('touchstart', e => { touchX = e.target.closest('a, button') ? null : e.touches[0].clientX; }, { passive: true });
addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) go(idx + (dx < 0 ? 1 : -1));
  touchX = null;
}, { passive: true });

// Bediening verbergen als je even niets doet
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3500);
}
['mousemove', 'mousedown', 'touchstart', 'focusin'].forEach(ev => addEventListener(ev, wake, { passive: true }));
wake();

// Tab verborgen: geen inhaalsprong als je terugkomt
document.addEventListener('visibilitychange', () => { lastNow = null; });

// ---- Tekenen ----
const cv = $('c'), cx = cv.getContext('2d');
let W, H, R, OY;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--center-top')) / 100 || 0.44;
  OY = H * top;
  const narrow = innerWidth <= 760;
  R = narrow ? Math.min(W * 0.36, H * 0.23) : Math.min(W * 0.5, H) * 0.31;
  // De ring mag de bovenbalk en de bediening onderaan nooit raken
  R = Math.min(R, (OY - 84 * dpr) / 1.1);
  if (!narrow) R = Math.min(R, (H - OY - 100 * dpr) / 1.1);
  R = Math.max(R, 40 * dpr);
}
addEventListener('resize', resize); resize();

const PARTICLES = Array.from({ length: 60 }, () => ({
  a: Math.random() * Math.PI * 2, d: 0.5 + Math.random() * 0.75,
  s: 0.6 + Math.random() * 1.4, v: (Math.random() - 0.5) * 0.06,
}));

// Kleur van de huidige fase, afgeleid van dezelfde klok: aan het begin van een fase vloeit de kleur
// in een korte, vaste tijd over van de vorige fase naar de nieuwe. Daardoor lopen kleur en adem altijd gelijk.
function phaseColor(tl, st) {
  if (st.done) return look.holdOut;
  const cur = look[st.ph.kind];
  const prevPh = tl.phases[(st.i - 1 + tl.phases.length) % tl.phases.length];
  const isFirstEver = st.cycles === 0 && st.i === 0;
  const blend = reduced ? 0.15 : Math.min(0.7, st.ph.dur * 0.35);
  const k = isFirstEver ? 1 : ease((st.rest - st.ph.t0) / blend);
  return mixC(look[prevPh.kind], cur, k);
}

let lastPhaseText = '', lastCount = '', lastSess = '', lastCycles = '', lastPhaseCss = '';
let snapshot = {};

function frame(now) {
  const dt = lastNow === null ? 0 : Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  const tl = TIMELINES[idx];

  if (!paused && !finished) {
    clock += dt; session += dt;
    if (rounds > 0 && clock >= rounds * tl.total) { session -= clock - rounds * tl.total; clock = rounds * tl.total; finished = true; setPaused(false); }
  }

  const st = stateAt(tl, clock, rounds);

  // Overgangen bij wisselen (niveau) en bij een ander thema of andere oefening (kleuren)
  if (swap) {
    swap.k = Math.min(1, swap.k + dt / (reduced ? 0.3 : 1.0));
    shownLevel = lerp(swap.from, st.level, ease(swap.k));
    if (swap.k >= 1) swap = null;
  } else shownLevel = st.level;
  const target = lookFor(idx, themeId);
  if (lookK < 1 && lookFrom) {
    lookK = Math.min(1, lookK + dt / (reduced ? 0.3 : 1.2));
    look = mixLook(lookFrom, target, ease(lookK));
    if (lookK >= 1) lookFrom = null;
  } else look = target;
  side = lerp(side, st.done ? 0 : (st.ph.side ?? 0), Math.min(1, dt * 3));

  const pc = phaseColor(tl, st);
  const b = shownLevel;
  const ox = W / 2, oy = OY;

  // Achtergrond: oorspronkelijke gradient, heel licht gekleurd door de fase
  const bg = cx.createRadialGradient(ox, oy, 0, ox, oy, Math.max(W, H) * 0.8);
  bg.addColorStop(0, rgbStr(mixC(look.bg0, pc, 0.08 + 0.06 * b)));
  bg.addColorStop(1, rgbStr(look.bg1));
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

  cx.save();
  cx.translate(ox, oy);

  const moving = !paused && !finished && !reduced;
  for (const p of PARTICLES) {
    if (moving) p.a += p.v * dt;
    const r = R * p.d * (0.7 + 0.5 * b);
    cx.fillStyle = rgbaStr(pc, 0.2 + 0.3 * b);
    cx.beginPath(); cx.arc(Math.cos(p.a) * r, Math.sin(p.a) * r, R * 0.006 * p.s, 0, Math.PI * 2); cx.fill();
  }

  const holding = !st.done && (st.ph.kind === 'holdIn' || st.ph.kind === 'holdOut');
  const shimmer = holding && moving ? Math.sin(now / 1000 * 3) * 0.006 : 0;
  const r = R * (0.34 + 0.5 * b + shimmer);
  const sx = side * R * 0.1; // bij wisselademhaling schuift de kern naar het actieve neusgat

  // Subtiele ademgloed: wordt ruimer en helderder naarmate de longen voller zijn
  const pulse = moving ? 0.5 + 0.5 * Math.sin(now / 1000 * 1.4) : 0.5;
  const haloR = r * (1.75 + 0.25 * b);
  const halo = cx.createRadialGradient(sx, 0, r * 0.9, sx, 0, haloR);
  halo.addColorStop(0, rgbaStr(pc, 0.10 + 0.10 * b + 0.03 * pulse)); halo.addColorStop(1, rgbaStr(pc, 0));
  cx.fillStyle = halo; cx.beginPath(); cx.arc(sx, 0, haloR, 0, Math.PI * 2); cx.fill();

  const glow = cx.createRadialGradient(sx, 0, r * 0.2, sx, 0, r * 1.6);
  glow.addColorStop(0, rgbaStr(pc, 0.5)); glow.addColorStop(0.6, rgbaStr(pc, 0.16)); glow.addColorStop(1, rgbaStr(pc, 0));
  cx.fillStyle = glow; cx.beginPath(); cx.arc(sx, 0, r * 1.6, 0, Math.PI * 2); cx.fill();
  const core = cx.createRadialGradient(sx, -r * 0.3, r * 0.1, sx, 0, r);
  core.addColorStop(0, 'rgba(255,255,255,0.3)'); core.addColorStop(1, rgbaStr(pc, 0.24));
  cx.fillStyle = core; cx.beginPath(); cx.arc(sx, 0, r, 0, Math.PI * 2); cx.fill();
  cx.strokeStyle = rgbaStr(pc, 0.75); cx.lineWidth = R * 0.006; cx.stroke();

  // Fase-ring: elk segment in de kleur van zijn fase
  const total = tl.total, ringR = R * 1.0, start = -Math.PI / 2;
  cx.lineCap = 'round';
  tl.phases.forEach((ph, k) => {
    const span = (ph.dur / total) * Math.PI * 2;
    const gap = Math.min(0.035, span * 0.2);
    const a0 = start + (ph.t0 / total) * Math.PI * 2 + gap, a1 = start + (ph.t1 / total) * Math.PI * 2 - gap;
    const active = !st.done && k === st.i;
    cx.strokeStyle = active ? rgbStr(mixC(look[ph.kind], WHITE, 0.15)) : rgbaStr(look[ph.kind], 0.32);
    cx.lineWidth = R * (active ? 0.014 : 0.008);
    cx.beginPath(); cx.arc(0, 0, ringR, a0, Math.max(a0 + 0.001, a1)); cx.stroke();
  });
  const pos = start + ((st.done ? 0 : st.rest) / total) * Math.PI * 2;
  cx.fillStyle = '#fff'; cx.shadowColor = rgbStr(pc); cx.shadowBlur = R * 0.06;
  cx.beginPath(); cx.arc(Math.cos(pos) * ringR, Math.sin(pos) * ringR, R * 0.022, 0, Math.PI * 2); cx.fill();
  cx.shadowBlur = 0;
  cx.restore();

  // Tekst en teller (alleen bijwerken als er iets verandert)
  const t = UI[lang];
  const phaseText = st.done ? t.done : phaseLabel(st.ph.label);
  const countText = st.done ? '✓' : String(Math.max(1, Math.ceil(st.left - 0.001)));
  const cycles = st.done ? rounds : st.cycles;
  const cyclesText = rounds > 0 ? `${cycles} / ${rounds}` : String(cycles);
  const sessText = fmtTime(session);
  if (phaseText !== lastPhaseText) { $('phase').textContent = lastPhaseText = phaseText; }
  if (countText !== lastCount) { $('count').textContent = lastCount = countText; }
  if (sessText !== lastSess) { $('sess').textContent = lastSess = sessText; }
  if (cyclesText !== lastCycles) { $('cycles').textContent = lastCycles = cyclesText; }
  const root = document.documentElement.style;
  const phaseCss = rgbStr(pc);
  if (phaseCss !== lastPhaseCss) {
    lastPhaseCss = phaseCss;
    root.setProperty('--phase', phaseCss);
    root.setProperty('--accent', rgbStr(look.accent));
    document.querySelectorAll('#rhythm span[data-kind]').forEach(s => s.style.setProperty('--c', rgbStr(look[s.dataset.kind])));
  }
  root.setProperty('--breath', (0.92 + 0.16 * b).toFixed(3));

  snapshot = { idx, clock, rounds, paused, finished, done: st.done, kind: st.done ? 'done' : st.ph.kind, i: st.i,
    label: phaseText, count: countText, cycles, level: st.level, color: phaseCss, theme: themeId, total };
}

// Eén animatielus: een fout in één frame stopt de app nooit, en er draait nooit een tweede lus.
let rafId = 0;
function loop(now) {
  rafId = 0;
  try { frame(now); } catch (err) { console.error('Breathwork frame', err); }
  if (!rafId) rafId = requestAnimationFrame(loop);
}
function startLoop() { if (!rafId) rafId = requestAnimationFrame(loop); }

// Alleen-lezen inkijk voor tests
window.__rhino = { state: () => ({ ...snapshot }), timelines: () => TIMELINES.map(t => ({ total: t.total, kinds: t.phases.map(p => p.kind) })) };

applyLang();
updateControls();
startLoop();
</script>
</body>
</html>
